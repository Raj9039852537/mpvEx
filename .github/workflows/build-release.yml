name: Build & Upload Preview APK

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set "y" to skip uploading to Telegram'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.set_apk.outputs.apk_path }}
      build_timestamp: ${{ steps.set_apk.outputs.build_timestamp }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        id: build_apk
        run: |
          ./gradlew assembleRelease
          APK=$(find app/build/outputs/apk/standard/release/ -name '*-release.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "No APK found!"
            exit 1
          fi
          echo "APK_PATH=$APK" >> $GITHUB_ENV
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "build_timestamp=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-apk
          path: ${{ steps.build_apk.outputs.apk_path }}

  upload:
    needs: build
    if: github.event.inputs.upload != 'y' && !contains(github.event.head_commit.message, '[skip upload]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -m pip install --upgrade pip requests
          python Tools/scripts/upload2.py
